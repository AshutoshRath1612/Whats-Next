name: Backend CI/CD

on:
  push:
    branches:
      - main
      - dev

    paths:
      - "server/**"
      - ".github/workflows/backend.yml"

  pull_request:
    branches:
      - main
      - dev

    paths:
      - "server/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ashutoshrath1612/whats-next-api

jobs:
  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Uncomment once you add tests
      #
      # - name: Run Tests
      #   run: npm test

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/ashutoshrath1612/whats-next-api:latest
            ghcr.io/ashutoshrath1612/whats-next-api:${{ github.sha }}