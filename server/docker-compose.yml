services:
  backend:
    image: ghcr.io/ashutoshrath1612/whats-next-api:latest
    container_name: whats-next-api
    pull_policy: always

    restart: unless-stopped

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      - "127.0.0.1:4000:4000"

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - whats-next-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower

    restart: unless-stopped

    environment:
    - DOCKER_API_VERSION=1.44

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/.docker/config.json:/config.json:ro

    command: >
      --interval 600
      --cleanup

    networks:
      - whats-next-network

  portainer:
    image: portainer/portainer-ce:latest

    container_name: portainer

    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - whats-next-network

  uptime-kuma:
    image: louislam/uptime-kuma:latest

    container_name: uptime-kuma

    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - uptime_kuma_data:/app/data

    networks:
      - whats-next-network
  
  loki:
    image: grafana/loki:2.9.8

    container_name: loki

    restart: unless-stopped

    command: -config.file=/etc/loki/config.yml

    volumes:
      - ./loki/config.yml:/etc/loki/config.yml
      - loki_data:/loki

    networks:
      - whats-next-network

  promtail:
    image: grafana/promtail:3.0.0

    container_name: promtail

    restart: unless-stopped

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - whats-next-network

  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ChangeThisPassword

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - whats-next-network

networks:
  whats-next-network:
    driver: bridge

volumes:
  portainer_data:
  uptime_kuma_data:
  loki_data:
  grafana_data: